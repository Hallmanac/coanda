name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x
      - name: Build
        run: dotnet build --configuration Release
      - name: Test
        # The windows Test step measured about 13 minutes on a green main run on 2026-11-19, and a main run
        # the same day was still passing tests when the 15-minute limit stopped it. The limit is there to
        # catch a hang, not to bound a normal run.
        timeout-minutes: 25
        run: dotnet test --configuration Release --no-build --verbosity normal
